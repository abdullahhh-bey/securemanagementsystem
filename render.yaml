services:
  - type: web
    name: examflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace backend && npm run build
    startCommand: npm run db:migrate:deploy --workspace backend && npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: examflow-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: examflow-db
          property: connectionString

databases:
  - name: examflow-db
    plan: free
    databaseName: examflow
    user: examflow
